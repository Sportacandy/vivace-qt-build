name: Run one build stage
description: >
  Restores the saved state of a kit, builds the next items until the time
  budget is used, and saves the state as an artifact for the next job.

inputs:
  kit:
    description: Kit name from versions/<qt_version>.json.
    required: true
  host:
    description: windows, linux or macos.
    required: true
  toolchain:
    description: msvc, mingw, android, gcc or clang.
    required: true
  webengine:
    description: "true if QtWebEngine is built."
    required: false
    default: "false"
  host-kit:
    description: Kit that provides the host Qt (Android kits only).
    required: false
    default: ""
  host-run-id:
    description: Workflow run that has the host Qt artifact. Empty means this run.
    required: false
    default: ""
  pool:
    description: >-
      Items to build: main (the stage jobs) or webengine (QtWebEngine and the
      modules that use it, when they run on a separate runner).
    required: false
    default: main
  state-from:
    description: Artifact with the state that the previous job left.
    required: true
  state-name:
    description: >-
      Base artifact name for the state that this job saves. Each job and each
      attempt has its own name (<state-name>-r<attempt>), so a failed upload
      cannot destroy the state of an earlier job or attempt.
    required: true
  fail-if-remaining:
    description: "true for the last job of a pool: fail if items are left."
    required: false
    default: "false"
  job-minutes:
    description: The timeout-minutes value of the calling job.
    required: true
  reserve-minutes:
    description: Minutes kept free at the end of the job to save the prefix.
    required: false
    default: "30"

outputs:
  remaining:
    description: Number of items of the pool that are not built yet.
    value: ${{ steps.run.outputs.remaining }}
  state-name:
    description: Artifact that has the newest state after this job.
    value: ${{ steps.result.outputs.state_name }}

runs:
  using: composite
  steps:
    # The same check as in setup-kit, but before the state download, which
    # can take more than 20 minutes on a self-hosted runner.
    - name: Check the directories of a self-hosted runner
      shell: bash
      run: |
        if [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ]; then
          for var in QTCI_PREFIX_ROOT QTCI_WORK; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Set $var on this self-hosted runner to a directory that only this build uses. The build deletes files in it."
              exit 1
            fi
          done
        fi

    # In a container, the job started before "Prepare the container" (kit.yml),
    # which recorded QTCI_JOB_START.
    - name: Record the start time
      shell: bash
      run: echo "QTCI_STAGE_START=${QTCI_JOB_START:-$(date +%s)}" >> "$GITHUB_ENV"

    # A self-hosted runner can name its own Python 3.12 in QTCI_PYTHON: the
    # directory of its python and python3 programs. setup-python has builds
    # for Ubuntu only, so a Debian runner (the webengine runner of gcc_arm64)
    # needs this. A variable of the runner's .env file is not in the env
    # context of "if:", so this step records the choice in QTCI_OWN_PYTHON.
    - name: Use the Python 3.12 of the runner
      if: env.QTCI_CONTAINER != 'true'
      shell: bash
      run: |
        if [ -z "${QTCI_PYTHON:-}" ]; then
          exit 0
        fi
        if ! ver=$("$QTCI_PYTHON/python3" -c 'import sys; print("%d.%d" % sys.version_info[:2])'); then
          echo "::error::QTCI_PYTHON is $QTCI_PYTHON, but $QTCI_PYTHON/python3 does not run."
          exit 1
        fi
        if [ "$ver" != 3.12 ]; then
          echo "::error::QTCI_PYTHON must name a Python 3.12, but $QTCI_PYTHON/python3 is Python $ver."
          exit 1
        fi
        if [ ! -e "$QTCI_PYTHON/python" ]; then
          echo "::error::$QTCI_PYTHON has no python program, which the workflow steps call. Add it: ln -s python3 $QTCI_PYTHON/python"
          exit 1
        fi
        echo "$QTCI_PYTHON" >> "$GITHUB_PATH"
        echo "QTCI_OWN_PYTHON=true" >> "$GITHUB_ENV"
        echo "Python $ver from $QTCI_PYTHON"

    # A container has the Python 3.12 of "Prepare the container" (kit.yml).
    - uses: actions/setup-python@v7
      if: env.QTCI_CONTAINER != 'true' && env.QTCI_OWN_PYTHON != 'true'
      with:
        python-version: "3.12"

    # Each attempt of a job saves its state as <state-name>-r<attempt>, so a
    # failed upload never deletes the state of an earlier attempt. Use the
    # newest one if an earlier attempt saved one. The lookup fails the job on
    # an API error, so that a transient error does not make the job continue
    # from the older state of the previous job.
    - name: Look for the state of an earlier attempt
      id: find
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        STATE_NAME: ${{ inputs.state-name }}
        STATE_FROM: ${{ inputs.state-from }}
      run: |
        name=$(python - <<'EOF'
        import json, os, re, urllib.request
        base = (f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
                f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100")
        pattern = re.compile(re.escape(os.environ["STATE_NAME"]) + r"-r([0-9]+)")
        best, page = None, 1
        while True:
            req = urllib.request.Request(f"{base}&page={page}", headers={
                "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                "Accept": "application/vnd.github+json"})
            with urllib.request.urlopen(req, timeout=60) as resp:
                artifacts = json.load(resp)["artifacts"]
            for a in artifacts:
                m = pattern.fullmatch(a["name"])
                if m and not a["expired"] and (best is None or int(m[1]) > best[0]):
                    best = (int(m[1]), a["name"])
            if len(artifacts) < 100:
                break
            page += 1
        print(best[1] if best else "")
        EOF
        )
        echo "name=$name" >> "$GITHUB_OUTPUT"
        if [ -z "$name" ]; then
          echo "::notice::No state from an earlier attempt of this job ($STATE_NAME); using $STATE_FROM."
        else
          echo "::notice::Using the state of an earlier attempt: $name."
        fi

    - name: Download the state of an earlier attempt
      id: own
      if: steps.find.outputs.name != ''
      uses: actions/download-artifact@v8
      with:
        name: ${{ steps.find.outputs.name }}
        path: ${{ runner.temp }}/state

    - name: Download the state of the previous job
      if: steps.find.outputs.name == ''
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.state-from }}
        path: ${{ runner.temp }}/state

    - uses: ./.github/actions/setup-kit
      with:
        kit: ${{ inputs.kit }}
        host: ${{ inputs.host }}
        toolchain: ${{ inputs.toolchain }}
        state-dir: ${{ runner.temp }}/state
        webengine: ${{ inputs.webengine }}
        host-kit: ${{ inputs.host-kit }}
        host-run-id: ${{ inputs.host-run-id }}

    - name: Build
      id: run
      shell: bash
      env:
        JOB_MINUTES: ${{ inputs.job-minutes }}
        RESERVE_MINUTES: ${{ inputs.reserve-minutes }}
        POOL: ${{ inputs.pool }}
        FAIL_IF_REMAINING: ${{ inputs.fail-if-remaining }}
        RUNNER_KIND: ${{ runner.environment }}
      run: |
        # A GitHub-hosted job stops after 360 minutes, whatever its timeout
        # is. The deadline must come before that stop, or nothing is saved.
        if [ "$RUNNER_KIND" = github-hosted ]; then
          export QTCI_GITHUB_HOSTED=1
          if [ "$JOB_MINUTES" -gt 360 ]; then
            echo "::warning::A GitHub-hosted job stops after 360 minutes; the job uses 360, not $JOB_MINUTES."
            JOB_MINUTES=360
          fi
        fi
        deadline=$(( QTCI_STAGE_START + (JOB_MINUTES - RESERVE_MINUTES) * 60 ))
        if [ "${{ inputs.host }}" = "macos" ]; then ulimit -n 10240; fi
        args=(--state "$RUNNER_TEMP/state" --deadline "$deadline" --pool "$POOL")
        if [ "$FAIL_IF_REMAINING" = "true" ]; then args+=(--fail-if-remaining); fi
        # exec: on a cancel, the runner signals the shell of the step;
        # Python must get the signal to stop the build processes.
        exec python tools/qtci.py stage "${args[@]}"

    # A new name for each attempt: the upload cannot delete an older state.
    - name: Save the build state
      id: save
      if: always() && steps.run.outputs.saved == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.state-name }}-r${{ github.run_attempt }}
        path: ${{ runner.temp }}/state
        compression-level: 0
        retention-days: 7

    - name: Report the newest state
      id: result
      if: always()
      shell: bash
      env:
        SAVED: ${{ steps.save.outcome }}
        OWN: ${{ steps.own.outcome }}
        OWN_NAME: ${{ steps.find.outputs.name }}
        SAVED_NAME: ${{ inputs.state-name }}-r${{ github.run_attempt }}
        STATE_FROM: ${{ inputs.state-from }}
      run: |
        if [ "$SAVED" = "success" ]; then
          echo "state_name=$SAVED_NAME" >> "$GITHUB_OUTPUT"
        elif [ "$OWN" = "success" ]; then
          echo "state_name=$OWN_NAME" >> "$GITHUB_OUTPUT"
        else
          echo "state_name=$STATE_FROM" >> "$GITHUB_OUTPUT"
        fi
