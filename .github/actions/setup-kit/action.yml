name: Set up a Qt kit build
description: >
  Installs the system packages and the third-party dependencies for one kit,
  and exports their locations (QTCI_* variables and LLVM_INSTALL_DIR).

inputs:
  kit:
    description: Kit name from versions/<qt_version>.json.
    required: true
  host:
    description: windows, linux or macos.
    required: true
  toolchain:
    description: msvc, mingw, android, gcc or clang.
    required: true
  state-dir:
    description: Directory that contains state.json and deps.json.
    required: true
  webengine:
    description: "true if QtWebEngine is built."
    required: false
    default: "false"
  host-kit:
    description: Kit that provides the host Qt (Android kits only).
    required: false
    default: ""
  host-run-id:
    description: Workflow run that has the host Qt artifact. Empty means this run.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set common paths
      shell: bash
      run: |
        # A self-hosted runner must name the directories that the build
        # deletes. Check it before anything is installed.
        if [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ]; then
          for var in QTCI_PREFIX_ROOT QTCI_WORK; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Set $var on this self-hosted runner to a directory that only this build uses. The build deletes files in it."
              exit 1
            fi
          done
        fi
        echo "QTCI_DEPS=$RUNNER_TEMP/qtci-deps" >> "$GITHUB_ENV"
        # Long paths for the git commands of this job only. "git config
        # --global" would change the settings of a self-hosted runner user.
        {
          echo "GIT_CONFIG_COUNT=1"
          echo "GIT_CONFIG_KEY_0=core.longpaths"
          echo "GIT_CONFIG_VALUE_0=true"
        } >> "$GITHUB_ENV"

    # ---------------------------------------------------------------- Windows
    - name: Install Windows packages
      if: inputs.host == 'windows'
      # bash (Git for Windows) exists on every runner that has Git. PowerShell 7
      # (pwsh) is on GitHub-hosted images only.
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        WEBENGINE: ${{ inputs.webengine }}
        RUNNER_KIND: ${{ runner.environment }}
      run: |
        has_openssl3() {
          for dir in 'C:/Program Files/OpenSSL-Win64' 'C:/Program Files/OpenSSL'; do
            grep -Eq '#[[:space:]]*define[[:space:]]+OPENSSL_VERSION_MAJOR[[:space:]]+3([^0-9]|$)' \
              "$dir/include/openssl/opensslv.h" 2> /dev/null && return 0
          done
          return 1
        }
        packages=()
        command -v ninja > /dev/null || packages+=(ninja)
        command -v zstd > /dev/null || packages+=(zstandard)
        command -v 7z > /dev/null || packages+=(7zip)
        need_openssl=false
        if [ "$TOOLCHAIN" = msvc ] || [ "$TOOLCHAIN" = mingw ]; then
          # Qt 6.12 needs OpenSSL 3. Install OpenSSL only if no OpenSSL 3 is
          # there (other software on a self-hosted machine can need its
          # OpenSSL), and then the newest 3.x version, not a later major one.
          has_openssl3 || need_openssl=true
        fi
        # MSVC uses the CMake of Visual Studio (vcvars64). The MinGW and
        # Android kits need CMake on PATH; GitHub-hosted images have it.
        if [ "$TOOLCHAIN" != msvc ] && ! command -v cmake > /dev/null; then
          packages+=(cmake)
        fi
        if [ "$WEBENGINE" = true ]; then
          [ -d 'C:/ProgramData/chocolatey/lib/winflexbison3' ] || packages+=(winflexbison3)
          command -v gperf > /dev/null || packages+=(gperf)
          # QtWebEngine needs Node.js. GitHub-hosted images have it; a
          # self-hosted runner can lack it.
          command -v node > /dev/null || packages+=(nodejs-lts)
        fi
        # On a GitHub-hosted runner, "upgrade" also installs a missing
        # package. On a self-hosted runner, "install" never changes a package
        # that is already installed.
        action=install
        if [ "$RUNNER_KIND" = github-hosted ]; then action=upgrade; fi
        choco_run() {
          # 3010 and 1641 mean "installed, reboot required", which the build
          # does not need.
          local rc=0
          choco "$action" -y --no-progress "$@" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3010 ] && [ "$rc" -ne 1641 ]; then
            echo "::error::choco $action $* failed ($rc)"
            exit "$rc"
          fi
        }
        if [ ${#packages[@]} -gt 0 ]; then choco_run "${packages[@]}"; fi
        if [ "$need_openssl" = true ] && [ "$RUNNER_KIND" != github-hosted ]; then
          # The OpenSSL 3 installer writes into the same directory as an older
          # OpenSSL. On a self-hosted machine, other software can need it.
          for dir in 'C:/Program Files/OpenSSL-Win64' 'C:/Program Files/OpenSSL'; do
            if [ -e "$dir" ]; then
              echo "::error::$dir has an older OpenSSL, and the build needs OpenSSL 3. Install OpenSSL 3 on this runner yourself, then re-run the job."
              exit 1
            fi
          done
        fi
        if [ "$need_openssl" = true ]; then
          version=$(choco search openssl --exact --all-versions --limit-output |
                    awk -F'|' '$1 == "openssl" && $2 ~ /^3\./ { print $2 }' | sort -V | tail -n 1)
          if [ -z "$version" ]; then
            echo "::error::Chocolatey has no OpenSSL 3.x package. Install OpenSSL 3 on this runner."
            exit 1
          fi
          choco_run openssl --version "$version"
        fi
        if { [ "$TOOLCHAIN" = msvc ] || [ "$TOOLCHAIN" = mingw ]; } && ! has_openssl3; then
          echo "::error::OpenSSL 3 is not installed (C:/Program Files/OpenSSL-Win64 or C:/Program Files/OpenSSL). Install OpenSSL 3 on this runner."
          exit 1
        fi
        printf '%s\n' 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"
        if [[ " ${packages[*]} " == *" nodejs-lts "* ]]; then
          printf '%s\n' 'C:\Program Files\nodejs' >> "$GITHUB_PATH"
        fi
        if [[ " ${packages[*]} " == *" cmake "* ]]; then
          printf '%s\n' 'C:\Program Files\CMake\bin' >> "$GITHUB_PATH"
        fi
        if [ "$WEBENGINE" = true ]; then
          python -c "import html5lib" 2> /dev/null || python -m pip install --quiet html5lib
        fi

    # ------------------------------------------------------------------ Linux
    # Removes preinstalled tools that the build does not use. Only on a
    # GitHub-hosted runner: a self-hosted machine keeps its own software.
    - name: Free disk space
      # In a container, these paths are not on the host disk.
      if: inputs.host == 'linux' && runner.environment == 'github-hosted' && env.QTCI_CONTAINER != 'true'
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
          /opt/hostedtoolcache/CodeQL /usr/local/lib/android || true
        df -h /

    - name: Install Linux packages
      if: inputs.host == 'linux'
      shell: bash
      env:
        WEBENGINE: ${{ inputs.webengine }}
        RUNNER_KIND: ${{ runner.environment }}
      run: |
        # GitHub-hosted images have CMake, a C++ compiler, and Git. Install
        # them only if they are missing, as on a new self-hosted machine.
        packages=()
        command -v cmake > /dev/null || packages+=(cmake)
        command -v g++ > /dev/null || packages+=(build-essential)
        command -v git > /dev/null || packages+=(git)
        packages+=(
          ninja-build p7zip-full zstd perl python3 pkg-config patchelf
          libgl-dev libglu1-mesa-dev libegl-dev libgbm-dev libdrm-dev libvulkan-dev
          libfontconfig1-dev libfreetype-dev libharfbuzz-dev libxkbcommon-dev libxkbcommon-x11-dev
          libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev
          libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev
          libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev
          libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xinerama0-dev
          libxcb-xkb-dev libxcb-xinput-dev
          libwayland-dev wayland-protocols libdbus-1-dev libglib2.0-dev libicu-dev libssl-dev
          libpq-dev libudev-dev libinput-dev libmtdev-dev libts-dev libcups2-dev libatspi2.0-dev
          libgtk-3-dev libzstd-dev libb2-dev libbrotli-dev
          libasound2-dev libpulse-dev libpipewire-0.3-dev
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev
          libbluetooth-dev libspeechd-dev libflite1 flite1-dev
          libprotobuf-dev protobuf-compiler libgrpc++-dev protobuf-compiler-grpc
        )
        if [ "$WEBENGINE" = true ]; then
          packages+=(
            gperf bison flex nodejs libnss3-dev libxshmfence-dev libxcomposite-dev
            libxdamage-dev libxrandr-dev libxtst-dev libxkbfile-dev libxss-dev libsnappy-dev
            libopus-dev libvpx-dev libwebp-dev liblcms2-dev libevent-dev libre2-dev libkrb5-dev
          )
        fi
        sudo apt-get update -q
        if [ "$RUNNER_KIND" != github-hosted ]; then
          # A self-hosted machine keeps its installed packages. A new package
          # can need a newer version of an installed one, or the removal of a
          # conflicting one; then stop and list them, instead of changing the
          # software of the machine. In the simulation, "Inst name [old
          # version]" is an upgrade and "Remv name" is a removal.
          if ! sim=$(apt-get -s install --no-install-recommends --no-upgrade "${packages[@]}" 2>&1); then
            echo "$sim"
            echo "::error::apt-get cannot install the build packages on this runner. Read the output above."
            exit 1
          fi
          changes=$(sed -n -e 's/^Inst \([^ ]*\) \[.*/\1 (upgrade)/p' \
                           -e 's/^Remv \([^ ]*\).*/\1 (removal)/p' <<< "$sim")
          if [ -n "$changes" ]; then
            echo "::error::The build packages need changes of installed packages: ${changes//$'\n'/, }. Make these changes on this runner, then re-run the job."
            exit 1
          fi
        fi
        # --no-remove: apt-get stops instead of removing an installed package.
        sudo apt-get install -y -q --no-install-recommends --no-upgrade --no-remove "${packages[@]}"
        if [ "$WEBENGINE" = true ]; then
          python3 -c "import html5lib" 2> /dev/null || python3 -m pip install --quiet html5lib
        fi

    # ------------------------------------------------------------------ macOS
    - name: Install macOS packages
      if: inputs.host == 'macos'
      shell: bash
      env:
        # Do not upgrade or clean up formulae that are already installed (a
        # self-hosted Mac keeps its own software).
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_UPGRADE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      run: |
        brew install ninja zstd sevenzip
        # GitHub-hosted images have CMake; a self-hosted Mac can lack it.
        command -v cmake > /dev/null || brew install cmake
        if [ "${{ inputs.webengine }}" = "true" ]; then
          brew install gperf bison flex
          # A self-hosted Mac can have its own Node.js; keep it.
          command -v node > /dev/null || brew install node
          # bison and flex are keg-only (macOS has older versions in /usr/bin).
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          python3 -c "import html5lib" 2> /dev/null ||
            python3 -m pip install --quiet --break-system-packages html5lib
        fi

    # The configure step of QtWebEngine 6.12 needs Node.js 20 or later
    # (cmake/FindNodejs.cmake of qtwebengine). The apt package of Ubuntu 24.04
    # is Node.js 18, and a self-hosted machine can keep its own older Node.js.
    # GitHub-hosted images have a newer one first in PATH. Stop here, not
    # after the checkout of Chromium.
    - name: Check the Node.js version
      if: inputs.webengine == 'true'
      shell: bash
      run: |
        min=20
        if ! version=$(node --version 2> /dev/null); then
          echo "::error::QtWebEngine needs Node.js $min or later, and there is no node in PATH. Install Node.js on this runner, then re-run the job."
          exit 1
        fi
        major=${version#v}
        major=${major%%.*}
        if ! [ "$major" -ge "$min" ] 2> /dev/null; then
          echo "::error::QtWebEngine needs Node.js $min or later, and $(command -v node) is $version. Install a newer Node.js on this runner (on Ubuntu, for example from NodeSource), then re-run the job."
          exit 1
        fi
        echo "Node.js $version ($(command -v node))"

    - name: Create the prefix root
      if: inputs.host != 'windows'
      shell: bash
      run: |
        root="${QTCI_PREFIX_ROOT:-}"
        if [ -z "$root" ] && [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ]; then
          echo "::error::Set QTCI_PREFIX_ROOT on this self-hosted runner. The build deletes files in it."
          exit 1
        fi
        if [ -z "$root" ]; then
          if [ "${{ inputs.host }}" = "macos" ]; then root="$HOME/Qt"; else root=/opt/Qt; fi
        fi
        # Use sudo only when needed, so that a self-hosted runner with a
        # prepared, writable root does not need sudo for this step.
        if ! { mkdir -p "$root" 2>/dev/null && [ -w "$root" ]; }; then
          sudo mkdir -p "$root"
          sudo chown "$(id -u):$(id -g)" "$root"
        fi

    # ----------------------------------------------------------- Dependencies
    - name: Compute the dependency cache key
      id: deps-key
      shell: bash
      env:
        STATE_DIR: ${{ inputs.state-dir }}
      run: |
        hash=$(python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest()[:16])" "$STATE_DIR/deps.json")
        echo "key=qtci-deps-${{ inputs.kit }}-${{ runner.os }}-$hash" >> "$GITHUB_OUTPUT"

    - name: Restore cached dependencies
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/qtci-deps
        key: ${{ steps.deps-key.outputs.key }}

    # The LGPL FFmpeg that the ffmpeg job of kit.yml built for this kit.
    - name: Download the FFmpeg
      uses: actions/download-artifact@v8
      with:
        name: ffmpeg-${{ inputs.kit }}
        path: ${{ runner.temp }}/ffmpeg

    # Its source archive goes into the state directory, so that every state
    # and host Qt artifact (they contain FFmpeg) carries its source. A state
    # of an earlier job already has it; then the artifact may have expired.
    - name: Download the FFmpeg source archive
      id: ffmpeg-source
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ffmpeg-source-${{ inputs.kit }}
        path: ${{ runner.temp }}/ffmpeg-source-download

    - name: Check the FFmpeg source archive
      shell: bash
      env:
        STATE_DIR: ${{ inputs.state-dir }}
        DOWNLOADED: ${{ steps.ffmpeg-source.outcome }}
      run: |
        # Only a complete download replaces the copy in the state; a failed
        # one could leave a partial file.
        if [ "$DOWNLOADED" = success ]; then
          mv -f "$RUNNER_TEMP"/ffmpeg-source-download/ffmpeg-*-source.tar "$STATE_DIR/"
        fi
        if ! ls "$STATE_DIR"/ffmpeg-*-source.tar > /dev/null 2>&1; then
          echo "::error::The FFmpeg source archive is in neither the state nor the ffmpeg-source artifact. Select Re-run all jobs."
          exit 1
        fi

    - name: Read the Qt version
      id: version
      if: inputs.toolchain == 'android'
      shell: bash
      env:
        DEPS: ${{ inputs.state-dir }}/deps.json
      run: |
        qt_version=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['qt_version'])" "$DEPS")
        echo "qt_version=$qt_version" >> "$GITHUB_OUTPUT"

    # The artifact name has the Qt version (see the package job of kit.yml).
    - name: Download the host Qt
      if: inputs.toolchain == 'android'
      uses: actions/download-artifact@v8
      with:
        name: host-qt-${{ steps.version.outputs.qt_version }}-${{ inputs.host-kit }}
        path: ${{ runner.temp }}/host-state
        run-id: ${{ inputs.host-run-id || github.run_id }}
        github-token: ${{ github.token }}

    - name: Install the host Qt
      if: inputs.toolchain == 'android'
      shell: bash
      env:
        QT_VERSION: ${{ steps.version.outputs.qt_version }}
      run: |
        # exec: on a cancel, Python gets the signal and stops zstd. restore
        # deletes the archive after the extraction; the runner empties
        # RUNNER_TEMP at the end of the job.
        exec python tools/qtci.py restore --state "$RUNNER_TEMP/host-state" --env QTCI_HOST_QT --qt-version "$QT_VERSION"

    - name: Install dependencies
      shell: bash
      # No token: setup-deps runs third-party code (pip, aqt, sdkmanager) and
      # calls no GitHub API.
      env:
        STATE_DIR: ${{ inputs.state-dir }}
      run: |
        args=(--state "$STATE_DIR" --deps-dir "$RUNNER_TEMP/qtci-deps"
              --ffmpeg-dir "$RUNNER_TEMP/ffmpeg")
        # exec: on a cancel, the runner signals the shell of the step;
        # Python must get the signal to stop its child processes.
        exec python tools/qtci.py setup-deps "${args[@]}"
